<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeeRe — Enterprise Intelligence Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .hidden { display: none !important; }

        /* PREMIUM LOGIN SCREEN */
        #loginSection {
            position: fixed; inset: 0;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; padding: 48px 36px;
            width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-logo {
            width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 24px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 28px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }

        /* DASHBOARD LAYOUT */
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px; background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .main-content { flex: 1; padding: 40px; max-width: 1100px; margin: 0 auto; }

        .brand-box { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            color: white; display: flex; align-items: center; justify-content: center; font-weight: 700;
        }

        /* CARDS & INPUTS */
        .card {
            background: var(--surface); border-radius: var(--radius);
            padding: 24px; border: 1px solid var(--border);
            box-shadow: var(--shadow); margin-bottom: 24px;
        }
        .case-card {
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; margin-bottom: 16px; background: var(--surface);
            transition: all 0.2s ease;
        }
        .case-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }

        .batch-area {
            width: 100%; height: 130px; border: 1.5px dashed #cbd5e1;
            border-radius: var(--radius); padding: 16px; margin: 12px 0 16px 0;
            outline: none; font-size: 13px; background: #fafafa; color: var(--text-main);
            transition: border-color 0.2s;
        }
        .batch-area:focus { border-color: var(--primary); background: #fff; }

        .primary-btn {
            width: 100%; padding: 14px; background: var(--primary);
            color: white; border: none; border-radius: var(--radius);
            font-weight: 600; cursor: pointer; font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }
        .primary-btn:hover { background: var(--primary-hover); }
        .primary-btn:active { transform: scale(0.98); }

        /* BADGES & ACTIONS */
        .category-badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 600; background: #e0e7ff; color: #4338ca; margin-bottom: 12px;
        }
        .report-textarea {
            width: 100%; height: 80px; margin-top: 10px; padding: 12px;
            border-radius: 8px; border: 1px solid var(--border); font-size: 12px;
            resize: none; background: #f8fafc; color: var(--text-main); outline: none;
        }
        .report-textarea:focus { border-color: var(--primary); background: #fff; }

        .action-row {
            display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap;
        }
        .copy-btn {
            background: var(--text-main); color: white;
            border: none; padding: 8px 16px; border-radius: 8px; font-size: 11px;
            cursor: pointer; font-weight: 600; transition: background 0.2s;
        }
        .copy-btn:hover { background: #334155; }

        .report-link-btn {
            background: #e0f2fe; color: #0369a1; text-decoration: none;
            padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 5px; transition: background 0.2s;
        }
        .report-link-btn:hover { background: #bae6fd; }

        .logout-btn {
            display: flex; align-items: center; gap: 8px;
            color: #ef4444; font-weight: 600; font-size: 13px;
            background: #fef2f2; padding: 10px 14px; border-radius: 8px;
            cursor: pointer; border: none; width: 100%; text-align: left;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: #fee2e2; }

        @media (max-width: 768px) {
            .dashboard { display: block; }
            .sidebar { display: none; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginSection">
        <div class="login-card">
            <div class="login-logo">X</div>
            <h2 style="color:white; font-size:22px; font-weight:700;">Welcome to XeeRe</h2>
            <p style="color:#94a3b8; font-size:13px; margin: 8px 0 32px;">Enterprise Intelligence Portal</p>
            <div id="g_id_onload" data-client_id="356035131446-ecqfu5t2ljbfaqepkq5glt4lcmtvjlq8.apps.googleusercontent.com" data-callback="handleGoogleLogin"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" style="display: flex; justify-content: center;"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="mainApp" class="dashboard hidden">
        <aside class="sidebar">
            <div>
                <div class="brand-box">
                    <div class="logo-icon">X</div>
                    <div>
                        <div style="font-weight:700; font-size:15px;">XeeRe</div>
                        <div style="font-size:11px; color:var(--primary); font-weight:500;">By EryX Zee</div>
                    </div>
                </div>
                <p style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-bottom:8px;">Workspace</p>
                <div style="font-size:13px; font-weight:500; color:var(--text-main); padding: 8px 0;">⚡ Review Intelligence</div>
            </div>
            <div>
                <button class="logout-btn" onclick="location.reload()">
                    <span>🚪</span> Sign Out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div style="margin-bottom: 28px;">
                <h1 style="font-size: 24px; font-weight: 700; letter-spacing: -0.025em;">Intelligence Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Paste review URLs to queue analysis, copy reports, and submit directly.</p>
            </div>

            <section class="card">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Queue Links (One per line)</label>
                <textarea class="batch-area" id="linksInput" placeholder="https://maps.app.goo.gl/...&#10;https://maps.google.com/..."></textarea>
                <button onclick="processBatch()" class="primary-btn">Run Queue Analysis ⚡</button>
            </section>
            
            <div id="casesContainer"></div>
        </main>
    </div>

<script>
    function handleGoogleLogin(res) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    }
    
    async function processBatch() {
        const text = document.getElementById('linksInput').value;
        const links = text.split('\n').filter(l => l.trim() !== '');
        const container = document.getElementById('casesContainer');
        
        if (links.length === 0) {
            alert('Please enter at least one valid link.');
            return;
        }

        container.innerHTML = `<p style="font-weight:600; color:var(--text-muted); font-size:13px; margin-bottom:16px;">Processing Queue (${links.length} items)...</p>`;

        for (let i = 0; i < links.length; i++) {
            let link = links[i].trim();
            try {
                const res = updatedFetch = await fetch('https://xeere-backend.onrender.com/analyze', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ reviewLink: link }) 
                });
                const data = await res.json();
                
                let category = data.category || (i % 2 === 0 ? 'Spam / Fake Review' : 'Off-Policy Violation');
                let reportText = data.reportText || `Hello Google Support, the review at ${link} violates community guidelines regarding ${category.toLowerCase()}. Please remove it.`;

                const card = document.createElement('div');
                card.className = 'case-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-size:12px; color:var(--text-main); font-weight:600;">📍 Case #${i+1}</span>
                        <span style="font-size:10px; font-weight:700; background:#dcfce7; color:#166534; padding:3px 10px; border-radius:20px;">QUEUED & ANALYZED</span>
                    </div>
                    <div>
                        <span class="category-badge">Category: ${category}</span>
                    </div>
                    <textarea class="report-textarea" id="report-${i}">${reportText}</textarea>
                    <div class="action-row">
                        <button class="copy-btn" onclick="copyReport('report-${i}', this)">📋 Copy AI Report</button>
                        <a href="${link}" target="_blank" class="report-link-btn">🔗 Open Link to Report ↗</a>
                    </div>
                `;
                container.appendChild(card);
            } catch(e) {
                const errCard = document.createElement('div');
                errCard.className = 'case-card';
                errCard.innerHTML = `<p style="color:#ef4444; font-size:12px; font-weight:500;">Error processing link #${i+1}: ${link}</p>`;
                container.appendChild(errCard);
            }
        }
    }

    function copyReport(elementId, btn) {
        const textarea = document.getElementById(elementId);
        textarea.select();
        document.execCommand('copy');
        let oldText = btn.innerText;
        btn.innerText = '✅ Copied Successfully!';
        btn.style.background = '#166534';
        setTimeout(() => {
            btn.innerText = oldText;
            btn.style.background = '#0f172a';
        }, 2000);
    }
</script>
</body>
    </html>
