<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XeeRe - Enterprise Review Intelligence Dashboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #090d16;
      --surface: #111827;
      --surface-card: #1f2937;
      --border: #374151;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Premium Header */
    header {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--primary);
    }

    .brand h1 {
      font-size: 1.3em;
      font-weight: 700;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .badge-pro {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 0.7em;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* Input Section Card */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      margin-bottom: 32px;
    }

    .hero-title {
      font-size: 1.4em;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 0.9em;
      margin-bottom: 20px;
    }

    .batch-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    textarea {
      width: 100%;
      height: 110px;
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95em;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hint {
      font-size: 0.85em;
      color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95em;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Category Navigation Tabs */
    .tabs-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95em;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      background: var(--surface-card);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 20px;
      font-size: 0.8em;
    }

    /* Dashboard Grid / Cards Layout */
    .kanban-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: border-color 0.2s;
    }

    .card-item:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 12px;
    }

    .link-display {
      font-size: 0.9em;
      color: var(--accent);
      word-break: break-all;
      font-weight: 500;
      text-decoration: none;
    }

    .link-display:hover {
      text-decoration: underline;
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .metric-box span {
      display: block;
      font-size: 0.75em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .metric-box strong {
      font-size: 1.1em;
      font-weight: 700;
    }

    /* Violations list preview */
    .violation-preview {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      max-height: 150px;
      overflow-y: auto;
    }

    .violation-row {
      font-size: 0.85em;
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .violation-row:last-child {
      border-bottom: none;
    }

    .pill {
      font-size: 0.7em;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pill-fake { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .pill-spam { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .pill-other { background: rgba(6, 182, 212, 0.2); color: var(--accent); }

    /* AI Generator Tool box inside card */
    .ai-tool-box {
      background: #0b0f19;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .ai-tool-box label {
      font-size: 0.8em;
      font-weight: 600;
      color: #818cf8;
      display: block;
      margin-bottom: 6px;
    }

    .ai-snippet {
      width: 100%;
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8em;
      height: 60px;
      resize: none;
      outline: none;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(99, 102, 241, 0.3);
    }

    /* Card Status Action Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-action-btn {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-action-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .loading-overlay {
      text-align: center;
      font-style: italic;
      color: var(--text-muted);
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <img src="https://images.unsplash.com/photo-1601133903174-1c55a2a1639e?ixlib=rb-4.0.3&auto=format&fit=crop&w=70&q=80" alt="XeeRe Logo" class="logo" />
      <h1>XeeRe Intelligence</h1>
      <span class="badge-pro">PRO SUITE</span>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Batch Upload Card (Up to 5 Links) -->
    <section class="hero-card">
      <h2 class="hero-title">Batch Review Auditor</h2>
      <p class="hero-desc">Paste up to **5 Google Maps review links** below (one link per line). Our intelligence engine will analyze all listings simultaneously.</p>
      
      <div class="batch-input-wrapper">
        <textarea id="bulkLinksInput" placeholder="https://www.google.com/maps/place/...&#10;https://www.google.com/maps/place/..."></textarea>
        <div class="controls-row">
          <span class="hint">💡 Tip: Enter maximum 5 links per batch scan. Free Render backend may take ~20s to wake up.</span>
          <button class="btn-primary" onclick="handleBatchAudit()">
            <span>⚡ Run Batch Analysis</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Category Tabs Navigation -->
    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('analysis', this)">
        <span>📊 Analysis Queue</span>
        <span class="counter-badge" id="count-analysis">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('followup', this)">
        <span>⏳ Follow Up / Pending</span>
        <span class="counter-badge" id="count-followup">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('removed', this)">
        <span>✅ Resolved & Removed</span>
        <span class="counter-badge" id="count-removed">0</span>
      </button>
    </nav>

    <!-- Global Loading Status -->
    <div id="globalStatus" class="loading-overlay hidden"></div>

    <!-- Kanban / Dashboard View Container -->
    <div id="kanbanView" class="kanban-container">
      <!-- Cards dynamically injected via JS based on active tab -->
    </div>
  </main>

  <script>
    // State management for items
    let auditItems = [];
    let currentTab = 'analysis';

    function switchTab(tabName, btnElement) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderDashboard();
    }

    async function handleBatchAudit() {
      const rawText = document.getElementById('bulkLinksInput').value.trim();
      if (!rawText) {
        alert('Please enter at least one Google Maps review link.');
        return;
      }

      // Parse links line by line
      let links = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      if (links.length > 5) {
        alert('Maximum 5 links allowed per batch. Please reduce the number of links.');
        return;
      }

      const statusDiv = document.getElementById('globalStatus');
      statusDiv.classList.remove('hidden');
      statusDiv.innerHTML = `🔄 Processing ${links.length} link(s) concurrently through cloud analyzer...`;

      // Process each link via the live Render backend
      for (let i = 0; i < links.length; i++) {
        const link = links[i];
        statusDiv.innerHTML = `🔄 Analyzing link ${i + 1} of ${links.length}...`;

        try {
          const response = await fetch('https://xeere-backend.onrender.com/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reviewLink: link })
          });

          if (!response.ok) throw new Error('Network response failed');
          const data = await response.json();

          if (!data.error) {
            const newItem = {
              id: 'AUD_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              link: link,
              totalReviews: data.totalReviews || 0,
              negativeReviews: data.negativeReviews || 0,
              violations: data.violations || [],
              status: 'analysis', // default category tab
              timestamp: new Date().toLocaleTimeString()
            };
            auditItems.unshift(newItem); // Add to top
          }
        } catch (err) {
          console.error('Error analyzing link:', link, err);
        }
      }

      statusDiv.classList.add('hidden');
      document.getElementById('bulkLinksInput').value = '';
      renderDashboard();
    }

    function updateItemStatus(id, newStatus) {
      const item = auditItems.find(i => i.id === id);
      if (item) {
        item.status = newStatus;
        renderDashboard();
      }
    }

    function copySnippet(elementId) {
      const txtBox = document.getElementById(elementId);
      txtBox.select();
      navigator.clipboard.writeText(txtBox.value).then(() => {
        alert('✅ AI Report Description copied! Ready to paste into Google reporting form.');
      });
    }

    function renderDashboard() {
      const container = document.getElementById('kanbanView');
      
      // Update counters
      const counts = {
        analysis: auditItems.filter(i => i.status === 'analysis').length,
        followup: auditItems.filter(i => i.status === 'followup').length,
        removed: auditItems.filter(i => i.status === 'removed').length
      };

      document.getElementById('count-analysis').textContent = counts.analysis;
      document.getElementById('count-followup').textContent = counts.followup;
      document.getElementById('count-removed').textContent = counts.removed;

      // Filter items for active tab
      const filteredItems = auditItems.filter(i => i.status === currentTab);

      if (filteredItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No items in this category</h3>
            <p>Use the batch auditor above to analyze up to 5 Google Maps links instantly.</p>
          </div>
        `;
        return;
      }

      let html = '';
      filteredItems.forEach(item => {
        const totalV = item.violations.length;
        const fakeCount = item.violations.filter(v => (v.category||'').toLowerCase().includes('fake')).length;
        const spamCount = item.violations.filter(v => (v.category||'').toLowerCase().includes('spam')).length;

        // Dynamic AI generator text snippet tailored to findings
        const aiSnippetText = `Hello Google Support Team, regarding business listing review audit (${item.link}), we identified ${totalV} policy-violating items (${fakeCount} fake reviews, ${spamCount} spam contents) violating Google Maps user review policies. Please investigate and action removal. Thank you.`;
        const snippetId = 'snippet_' + item.id;

        // Build violation previews
        let violationsHtml = '';
        if (item.violations.length > 0) {
          item.violations.forEach(v => {
            let pillClass = 'pill-other';
            const catLower = (v.category || '').toLowerCase();
            if (catLower.includes('fake')) pillClass = 'pill-fake';
            else if (catLower.includes('spam')) pillClass = 'pill-spam';

            violationsHtml += `
              <div class="violation-row">
                <div><span class="pill ${pillClass}">${v.category || 'Violation'}</span> <span style="color:var(--text-muted); margin-left:6px;">${v.type}</span></div>
                <a href="${v.link}" target="_blank" style="color:var(--primary); text-decoration:none; font-size:0.8em;">Source ↗</a>
              </div>
            `;
          });
        } else {
          violationsHtml = `<div style="text-align:center; color:var(--text-muted); font-size:0.85em; padding: 10px;">No critical violations flagged. Listing appears safe.</div>`;
        }

        html += `
          <div class="card-item">
            <div class="card-header">
              <div>
                <a href="${item.link}" target="_blank" class="link-display">📍 ${item.link}</a>
                <span style="display:block; font-size:0.75em; color:var(--text-muted); margin-top:2px;">Scanned at ${item.timestamp}</span>
              </div>
            </div>

            <!-- Metrics -->
            <div class="metrics-row">
              <div class="metric-box">
                <span>Total Scanned</span>
                <strong>${item.totalReviews}</strong>
              </div>
              <div class="metric-box">
                <span>Negative</span>
                <strong style="color:var(--danger);">${item.negativeReviews}</strong>
              </div>
              <div class="metric-box">
                <span>Violations</span>
                <strong style="color:var(--warning);">${totalV}</strong>
              </div>
            </div>

            <!-- Violation Details Preview -->
            <div class="violation-preview">
              ${violationsHtml}
            </div>

            <!-- AI Tool Integration -->
            <div class="ai-tool-box">
              <label>🤖 AI Report Justification (Copy & Paste to Google)</label>
              <textarea class="ai-snippet" id="${snippetId}" readonly>${aiSnippetText}</textarea>
              <button class="btn-secondary" onclick="copySnippet('${snippetId}')">📋 Copy Report Description</button>
            </div>

            <!-- Card Action Footer (Status Switcher) -->
            <div class="card-footer">
              <span style="font-size: 0.8em; color: var(--text-muted);">Move to Status:</span>
              <div class="status-actions">
                ${currentTab !== 'analysis' ? `<button class="status-action-btn" onclick="updateItemStatus('${item.id}', 'analysis')">📊 Analysis</button>` : ''}
                ${currentTab !== 'followup' ? `<button class="status-action-btn" onclick="updateItemStatus('${item.id}', 'followup')">⏳ Pending / Follow Up</button>` : ''}
                ${currentTab !== 'removed' ? `<button class="status-action-btn" onclick="updateItemStatus('${item.id}', 'removed')" style="color:var(--success);">✅ Mark Removed</button>` : ''}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Initial render
    renderDashboard();
  </script>
</body>
  </html>
