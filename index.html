<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeeRe — Enterprise Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --text: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .hidden { display: none !important; }

        /* LOGIN SCREEN */
        #loginSection { position: fixed; top:0; left:0; width:100vw; height:100vh; background: linear-gradient(135deg, #0f172a, #1e1b4b); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; text-align: center; }
        .login-logo { width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 20px; background: linear-gradient(135deg, #6366f1, #06b6d4); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px; }

        /* DASHBOARD */
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: #fff; border-right: 1px solid #e2e8f0; padding: 20px; }
        .main-content { flex: 1; padding: 25px; }
        .brand-box { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #06b6d4); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; }
        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .case-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .batch-area { width: 100%; height: 110px; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 12px; margin: 10px 0; }
        .report-btn { background: #0f172a; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 600; }
        
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { width: 100%; } }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="login-card">
            <div class="login-logo">X</div>
            <h2 style="color:white;">Welcome to XeeRe</h2>
            <p style="color:#94a3b8; font-size:12px; margin: 10px 0 30px;">Secure Login via Google</p>
            <div id="g_id_onload" data-client_id="356035131446-ecqfu5t2ljbfaqepkq5glt4lcmtvjlq8.apps.googleusercontent.com" data-callback="handleGoogleLogin"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
        </div>
    </div>

    <div id="mainApp" class="dashboard hidden">
        <aside class="sidebar">
            <div class="brand-box">
                <div class="logo-icon">X</div>
                <div>
                    <div style="font-weight:800;">XeeRe</div>
                    <div style="font-size:10px; color:#6366f1;">By EryX Zee</div>
                </div>
            </div>
            <p style="cursor:pointer;" onclick="location.reload()">🚪 Logout</p>
        </aside>
        <main class="main-content">
            <h1>Intelligence Dashboard</h1>
            <section class="card">
                <textarea class="batch-area" id="linksInput" placeholder="Paste up to 5 Google Maps links..."></textarea>
                <button onclick="processBatch()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer;">RUN BATCH ANALYSIS ⚡</button>
            </section>
            <div id="casesContainer"></div>
        </main>
    </div>

<script>
    function handleGoogleLogin(res) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    }
    
    async function processBatch() {
        const text = document.getElementById('linksInput').value;
        const links = text.split('\n').filter(l => l.trim() !== '');
        const container = document.getElementById('casesContainer');
        container.innerHTML = '<p>Analyzing...</p>';

        for (let link of links) {
            try {
                const res = await fetch('https://xeere-backend.onrender.com/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ reviewLink: link.trim() }) });
                const data = await res.json();
                const card = document.createElement('div');
                card.className = 'card case-card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <a href="${link}" target="_blank" style="font-size:12px;">📍 ${link.substring(0,30)}...</a>
                        <span style="font-size:10px; font-weight:700; color:green;">ANALYZED</span>
                    </div>
                    <div style="margin:10px 0;">
                        <div style="margin-bottom:5px;"><a href="${link}" class="report-btn">Spam Report ↗</a></div>
                        <div style="margin-bottom:5px;"><a href="${link}" class="report-btn">Off-Topic Report ↗</a></div>
                    </div>
                    <textarea id="ai-${Math.random()}">Hello Google, this review on ${link} violates policy.</textarea>
                    <button onclick="alert('Copied!')" style="margin-top:5px; font-size:10px; cursor:pointer;">📋 Copy AI Report</button>
                `;
                container.appendChild(card);
            } catch(e) { alert('Error analyzing.'); break; }
        }
    }
</script>
</body>
</html>
