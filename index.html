async function react(post){if(!me)return toast('Please login first');const ref=db.collection('eryx0_posts').doc(post.id);await db.runTransaction(async tx=>{const s=await tx.get(ref);const d=s.data()||{};const reactions={...(d.reactions||{})};if(reactions[me.uid])delete reactions[me.uid];else reactions[me.uid]='like';tx.update(ref,{reactions})});if(post.authorId&&post.authorId!==me.uid)await db.collection('eryx0_notifications').add({toUserId:post.authorId,fromUid:me.uid,type:'reaction',postId:post.id,text:'reacted to your post',read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
async function save(post){if(!me)return toast('Please login first');const ref=db.collection('eryx0_users').doc(me.uid);const s=await ref.get();const saved=s.data()?.savedPosts||[];const next=saved.includes(post.id)?saved.filter(x=>x!==post.id):[...saved,post.id];await ref.set({savedPosts:next},{merge:true});toast(saved.includes(post.id)?'Post unsaved':'Post saved')}
async function refreshPostActions(){if(!db||!me)return;const snap=await db.collection('eryx0_posts').orderBy('createdAt','desc').limit(50).get();const docs=snap.docs;const cards=QA('.space-y-4 > div.bg-white.rounded-\\[20px\\].p-4'); if(!cards.length)return;cards.forEach((card,i)=>{const doc=docs[i];if(!doc||card.dataset.eryxActions)return;const post={id:doc.id,...doc.data()};card.dataset.eryxActions='1';const row=document.createElement('div');row.className='eryx0-profile-actions';row.innerHTML='<button class="eryx0-mini-btn eryx0-soft">♥ Like</button><button class="eryx0-mini-btn eryx0-outline">💬 Comment</button><button class="eryx0-mini-btn eryx0-outline">🔖 Save</button><button class="eryx0-mini-btn eryx0-outline">↗ Share</button>';const bs=row.querySelectorAll('button');bs[0].onclick=()=>react(post);bs[1].onclick=()=>comments(post);bs[2].onclick=()=>save(post);bs[3].onclick=async()=>{try{await navigator.clipboard?.writeText(location.href+'#post-'+post.id)}catch{}toast('Post link copied')};card.appendChild(row);});}
function profileActions(){if(!me)return;QA('button').forEach(b=>{if(b.dataset.eryxProfileBound)return;const t=b.textContent.trim();if(t!=='Message'||!b.parentElement?.innerText?.includes('Call'))return;b.dataset.eryxProfileBound='1';const add=document.createElement('button');add.className=b.className;add.textContent='Follow';b.parentElement.insertBefore(add,b);add.onclick=async()=>{const name=b.parentElement.parentElement?.innerText?.split('\n')[0]?.trim();if(!name)return;try{const q=await db.collection('eryx0_users').where('name','==',name).limit(1).get();if(q.empty)return toast('User not found');const id=q.docs[0].id;if(id===me.uid)return;const f=db.collection('follows').doc(me.uid+'_'+id);const s=await f.get();if(s.exists){await f.delete();toast('Unfollowed')}else{await f.set({followerId:me.uid,followingId:id,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('eryx0_notifications').add({toUserId:id,fromUid:me.uid,type:'follow',text:'started following you',read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Following')}}catch(e){console.warn(e);toast('Follow failed')}}})}
function observe(){const o=new MutationObserver(()=>{refreshPostActions();profileActions()});o.observe(document.body,{subtree:true,childList:true});setInterval(refreshPostActions,3000)}
function boot(){modal();if(setup())observe();else setTimeout(boot,500)}boot();window.eryx0SocialActions={react,comments,save};}})();
</script>
</body>
</html>
<script>
(function(){
  function cleanNonProductionUI(){
    document.querySelectorAll('button,div,h1,h2,h3,h4,span').forEach(function(el){
      var text=(el.textContent||'').trim();
      if(text==='Eryx AI' || text==='Ask Eryx...') {
        var target=el.closest('button') || el.closest('[role="button"]') || el;
        if(target) target.style.display='none';
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanNonProductionUI);
  else cleanNonProductionUI();
  setTimeout(cleanNonProductionUI,1000);
})();
</script>
