<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XeeRe - Review Analysis & Decision</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      --primary-color: #00c3ff;
      --secondary-color: #0077ff;
      --card-bg-main: rgba(255, 255, 255, 0.15);
      --text-color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: #001f3f; padding: 20px;
      text-align: center; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .logo-container { display: flex; align-items: center; justify-content: center; }
    .logo { width: 60px; height: 60px; margin-right: 15px; border-radius: 50%; object-fit: cover; }
    header h1 { margin: 0; font-size: 2.2em; color: var(--primary-color); font-weight: 600; }
    main { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .page-title { text-align: center; margin-bottom: 20px; font-size: 1.8em; color: var(--text-color); }
    .card {
      width: 100%; max-width: 800px; padding: 30px;
      background: var(--card-bg-main); border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3); text-align: center; backdrop-filter: blur(5px);
    }
    h2 { color: var(--primary-color); margin-top: 0; }
    .input-group {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;
      margin-top: 20px; margin-bottom: 20px;
    }
    #reviewLink {
      flex: 1; min-width: 280px; padding: 12px 16px; border: none; border-radius: 8px;
      font-size: 1em; background: rgba(255, 255, 255, 0.9); color: #333; outline: none;
    }
    #analyzeBtn {
      padding: 12px 25px; font-size: 1em; cursor: pointer; border: none; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: #fff; font-weight: 600;
    }
    #results { margin-top: 25px; text-align: left; }
    h3 { text-align: center; color: var(--primary-color); margin-bottom: 15px; }
    .loading { text-align: center; font-style: italic; color: #ddd; }
    ul { list-style-type: none; padding: 0; }
    li { margin-bottom: 8px; background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 8px; }
    @media (max-width: 600px) {
      .input-group { flex-direction: column; }
      #reviewLink, #analyzeBtn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://images.unsplash.com/photo-1601133903174-1c55a2a1639e?ixlib=rb-4.0.3&auto=format&fit=crop&w=70&q=80" alt="XeeRe Logo" class="logo" />
      <h1>XeeRe</h1>
    </div>
  </header>

  <main>
    <h1 class="page-title">Google Reviews Analysis & Decision</h1>

    <section id="mainContent" class="card">
      <h2>Welcome, User</h2>
      <p>Enter your Google Maps review link below:</p>
      
      <div class="input-group">
        <input type="text" id="reviewLink" placeholder="Paste Google Maps review link here" />
        <button id="analyzeBtn" onclick="analyzeReviews()">Analyze & Decide</button>
      </div>

      <div id="results">
        <h3>Analysis & Decision</h3>
        <div id="status" class="loading"></div>
        <div id="analysisOutput"></div>
      </div>
    </section>
  </main>

  <script>
    async function analyzeReviews() {
      const link = document.getElementById('reviewLink').value.trim();
      const statusDiv = document.getElementById('status');
      const outputDiv = document.getElementById('analysisOutput');

      if (!link) {
        alert('Please enter a Google Maps review link.');
        return;
      }

      statusDiv.innerHTML = 'Fetching and analyzing reviews, please wait... (Render server might take 30s to wake up)';
      outputDiv.innerHTML = '';

      try {
        const response = await fetch('https://xeere-backend.onrender.com/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reviewLink: link })
        });
        
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();
        statusDiv.innerHTML = '';

        if (data.error) {
          outputDiv.innerHTML = `<p style="color:#ff6b6b;">Error: ${data.error}</p>`;
          return;
        }

        let categories = { spam: [], hate: [], fake: [], other: [] };
        data.violations.forEach(v => {
          const cat = (v.category || '').toLowerCase();
          if (cat.includes('spam')) categories.spam.push(v);
          else if (cat.includes('hate')) categories.hate.push(v);
          else if (cat.includes('fake')) categories.fake.push(v);
          else categories.other.push(v);
        });

        const totalViolations = data.violations.length;
        const criticalCategoriesCount = categories.hate.length + categories.fake.length;
        const removalRecommended = criticalCategoriesCount > 0;

        let reportHTML = `
          <p><strong>Total reviews analyzed:</strong> ${data.totalReviews}</p>
          <p><strong>Negative reviews detected:</strong> ${data.negativeReviews}</p>
          <h4 style="margin-top:15px; color:#00c3ff;">Violations Categorized:</h4>
          <ul>
        `;

        for (const [cat, items] of Object.entries(categories)) {
          if (items.length > 0) {
            reportHTML += `<li><strong>${cat.charAt(0).toUpperCase() + cat.slice(1)}</strong> (${items.length}):<ul>`;
            items.forEach(v => {
              reportHTML += `<li style="font-size: 0.9em; margin-top: 5px;">ID: ${v.id} — ${v.type} — <a href="${v.link}" target="_blank" style="color:#00c3ff;">View</a> | <a href="${v.actionLink}" target="_blank" style="color:#ffcc00;">${v.actionText}</a></li>`;
            });
            reportHTML += `</ul></li>`;
          }
        }
        reportHTML += `</ul>`;

        reportHTML += `<h4 style="margin-top:15px; color:#00c3ff;">Decision:</h4>`;
        if (removalRecommended) {
          reportHTML += `<p style="color:#ff6b6b; font-weight:600;">Based on the violations, it is recommended to flag or review this link.</p>`;
        } else {
          reportHTML += `<p style="color:#51cf66; font-weight:600;">No critical violations detected. The link may not require removal.</p>`;
        }

        reportHTML += `<button onclick="reportViolations('${totalViolations}')"
          style="margin-top:15px; padding:10px 20px; background:#ff4d4d; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; width: 100%;">Report Violations</button>`;

        outputDiv.innerHTML = reportHTML;

      } catch (err) {
        statusDiv.innerHTML = '';
        outputDiv.innerHTML = `<p style="color:#ff6b6b;">Error connecting to server: ${err.message}. (Note: Free Render server sleeps after inactivity, try clicking analyze again after 30 seconds).</p>`;
      }
    }

    function reportViolations(total) {
      alert(`Reported ${total} violations for manual review.`);
    }
  </script>
</body>
</html>
